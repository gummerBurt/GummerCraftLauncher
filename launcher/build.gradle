plugins {
    id 'application'
    id 'java-library'
    id "com.github.johnrengelman.shadow"
    id 'io.freefair.lombok'
    id 'net.kyori.blossom'
}

// get repo info
// офіційні збірки передають коміт ПУБЛІЧНОЇ репи (-PsourceCommit=...), щоб у jar стояв коміт, який є на GitHub (дивись tools/verify-cdn.py)
def gitCommit = project.findProperty('sourceCommit') ?: 'git rev-parse --short HEAD'.execute(null, project.rootDir).text.trim()
def branchName = project.findProperty('sourceBranch') ?: 'git rev-parse --abbrev-ref HEAD'.execute(null, project.rootDir).text.trim()

// use blossom to replace placeholders on build
blossom {
  replaceToken("@version@", version)
}

application {
    mainClassName = "com.skcraft.launcher.Launcher"
}

jar {
  manifest {
    attributes("Main-Class": "com.skcraft.launcher.Launcher")
    attributes("SplashScreen-Image": "com/gummer/launcher/splashscreen.png")
  }
}

dependencies {
    api 'javax.xml.bind:jaxb-api:2.3.1'
    api 'com.fasterxml.jackson.core:jackson-databind:2.13.2.2'
    api 'commons-lang:commons-lang:2.6'
    api 'commons-io:commons-io:1.2'
    api 'com.google.guava:guava:15.0'
    api 'com.beust:jcommander:1.82'
    api 'com.miglayout:miglayout:3.7.4'
    api 'com.google.code.findbugs:jsr305:3.0.2'
    //api("org.apache.commons:commons-lang3:3.12.0") // off for now
    //api("org.apache.commons:commons-text:1.9")

    implementation 'com.googlecode.plist:dd-plist:1.23'
    implementation 'net.java.dev.jna:jna-platform:5.11.0'
    implementation 'net.java.dev.timingframework:timingframework:1.0'
    implementation 'org.json:json:20210307'
    // 17.11.2026: іконки Modrinth (WebP) у вікні «Керування збіркою»; чистий Java, BSD-3, Java 8+. Викликається напряму (ModrinthBrowse.icon)
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'

    implementation project(path: ':launcher-shared')
}

processResources {
    // 18.11.2026: без цього інкрементальна збірка лишала стару версію в launcher.properties після зміни version
    // (тестовий jar 1.36 показував «v1.35»; release.sh робить clean, реліз це не зачіпало)
    inputs.property('projectVersion', project.version.toString())
    filesMatching('**/*.properties') {
        filter {
            it.replace('${project.version}', project.version)
        }
        filter {
            it.replace('${pipelineId}', System.getenv('CI_PIPELINE_ID') ?: 'local')
        }
        filter {
            it.replace('${branch}', branchName)
        }
        filter {
            it.replace('${commit}', gitCommit)
        }
        filter {
            // Azure app id for Microsoft login; set microsoftClientId in gradle.properties (see gradle.properties.example)
            def clientId = project.findProperty('microsoftClientId')
            if (!clientId) {
                throw new GradleException("Set microsoftClientId in gradle.properties (see gradle.properties.example)")
            }
            it.replace('${microsoftClientId}', clientId)
        }
    }
}

shadowJar {
    archiveClassifier.set("")
    // 17.11.2026: TwelveMonkeys (WebP) викликається напряму; без його реєстрації в ImageIO читання інших картинок не міняється
    exclude 'META-INF/services/javax.imageio.spi.*'
}

build {
    dependsOn(shadowJar)
}

// 28.11.2026 (1.41.7): мовний файл з переносом рядка всередині значення без "\" Java тихо обрізає до першого рядка, а решту
// читає як сміттєві ключі (так у 1.36.4-1.41.6 вікна про теку з грою і про /login показували лише перше речення). Тепер збірка падає.
task checkLangFiles {
    def dirs = ['src/main/resources/com/gummer/launcher/lang', 'src/main/resources/com/skcraft/launcher/lang']
    inputs.files(dirs.collect { fileTree(it) { include '*.properties' } })
    doLast {
        def bad = []
        dirs.each { d ->
            fileTree(d) { include '*.properties' }.each { f ->
                boolean cont = false
                f.readLines('UTF-8').eachWithIndex { line, i ->
                    def l = line.replaceAll(/\r$/, '')
                    int bs = 0; while (bs < l.length() && l.charAt(l.length() - 1 - bs) == (char) 92) bs++; boolean ends = bs % 2 == 1
                    if (cont) { cont = ends; return }
                    def t = l.trim()
                    if (t.isEmpty() || t.startsWith('#') || t.startsWith('!')) return
                    if (!(l ==~ /^\s*[A-Za-z0-9_.\-]+\s*[=:].*/)) bad << "${f.name}:${i + 1}: ${t.take(60)}"
                    cont = ends
                }
            }
        }
        if (bad) throw new GradleException("Рядки мовних файлів без ключа (перенос усередині значення? пиши \n):\n" + bad.join('\n'))
    }
}
processResources.dependsOn checkLangFiles
