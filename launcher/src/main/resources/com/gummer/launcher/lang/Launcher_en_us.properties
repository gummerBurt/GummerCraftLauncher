features.homescreen=<html><br/><h1 style="text-align:center">Select Additional Options</h1><br/><p style="padding:0 20px 0 20px">The list on the left lists the available additional options and add-ons for the client<br/>Click on any of them to view a detailed description and information about its functionality</p><p style="padding:0 20px 0 20px">In order for the add-on to be installed and enabled, the checkbox opposite it must be checked in the list of available options. In order for the add-on to not be installed, the checkbox opposite it must be unchecked (empty)</p><p style="padding:0 20px 0 20px">By default, all available additional options will be installed and enabled. If you wish, you can disable some or all of the additional options and add-ons to get a more vanilla client, but we strongly recommend installing all available add-ons to be able to fully enjoy all the features available on HammerCraft!</p><p style="padding:0 20px 0 20px">Click the continue button after you have selected the add-ons and options you wish to install</p></html>
