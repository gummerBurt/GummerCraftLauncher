support.attachLogs=Додати лог і дані системи
support.attachLogsTooltip=Лог лаунчера, останній лог гри і свіжий звіт про збій вибраного модпака, версії Windows і Java. Паролі та токени входу туди не потрапляють.
support.privacy=Нік і контакти ми використовуємо лише для того, аби якомога швидше відповісти на твоє запитання. Відповідь з'явиться тут, у вікні підтримки.
