features.homescreen=<html><br/><h1 style="text-align:center">Обери додаткові опції</h1><br/><p style="padding:0 20px 0 20px">У списку зліва перелічені доступні додаткові опції та доповнення клієнта.<br/>Натисни на будь-яку з них, щоб переглянути детальний опис та інформацію про її функціонал.</p><p style="padding:0 20px 0 20px">Щоб доповнення було встановлено та увімкнено, біля нього в списку має стояти позначка. Щоб доповнення не встановлювалось, зніми позначку.</p><p style="padding:0 20px 0 20px">За замовчуванням встановлюються та вмикаються всі доступні додаткові опції. За бажанням ти можеш вимкнути деякі або всі, щоб отримати більш ванільний клієнт, проте наполегливо радимо встановити все, щоб повноцінно насолодитися всіма фічами ГаммерКрафту!</p><p style="padding:0 20px 0 20px">Натисни «Продовжити», коли обереш потрібні доповнення та опції.</p></html>
