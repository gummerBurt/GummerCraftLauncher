crash.supportText=Гра {0} закрилась з помилкою. Лаунчер визначив: {1}. Лог і звіт про збій додано автоматично. Що я робив перед вильотом:
crash.memory.title=Грі не вистачило пам''яті
crash.memory.advice=Збільш пам''ять для цього паку: «Налаштувати пам''ять», далі 4-6 ГБ для модпаків. Більше половини оперативної пам''яті комп''ютера ставити не варто.
crash.memoryTooHigh.title=Java не змогла виділити стільки пам''яті
crash.memoryTooHigh.advice=У налаштуваннях стоїть більше пам''яті, ніж комп''ютер може дати. Зменш її: «Налаштувати пам''ять», наприклад до 4 ГБ, і закрий зайві програми.
crash.javaVersion.title=Не та версія Java
crash.javaVersion.advice=Пак запустився на Java, яка йому не підходить. Перевстанови пак, і лаунчер заново поставить потрібну Java. Якщо в налаштуваннях лаунчера ти вибрав свою Java, вимкни це.
crash.macArch.title=Не та Java для Mac з Apple Silicon
crash.macArch.advice=Гра запустилась на Java під Apple Silicon, а ця версія Minecraft має бібліотеки лише для Intel. Онови лаунчер до найновішої версії та запусти ще раз: він сам візьме Java для Intel через Rosetta 2. Якщо в налаштуваннях вибрано свою Java, прибери її.
crash.driver.title=Проблема з драйвером відеокарти
crash.driver.advice=Гра впала через драйвер відеокарти. Онови драйвер з сайту виробника (NVIDIA, AMD або Intel), перезавантаж комп''ютер та спробуй ще раз. На ноутбуці з двома відеокартами вибери для Java потужнішу.
crash.duplicateMod.title=Один мод встановлено двічі{0}
crash.duplicateMod.advice=У теці модів є дві копії одного мода. Якщо ти додавав моди вручну, прибери зайву копію або перевстанови пак - лаунчер поверне його до початкового стану.
crash.modConflict.title=Моди не сумісні між собою{0}
crash.modConflict.advice=Один з модів не підходить до інших або до цієї версії гри. Якщо ти додавав моди вручну, прибери їх, або перевстанови пак - лаунчер поверне його до початкового стану.
crash.mixin.title=Мод не зміг завантажитись{0}
crash.mixin.advice=Швидше за все це сторонній мод, доданий вручну, або пошкоджений файл. Перевстанови пак. Якщо не допоможе, напиши в підтримку - звіт про збій відправиться разом зі зверненням.
crash.missingDep.title=Моду бракує іншого мода{0}
crash.missingDep.advice=Перший мод не працює без другого, а його в збірці немає (зліва мод, справа те, що йому потрібно). Відкрий «Збірка», вкладка «Знайти моди» та встанови потрібне - лаунчер сам підбере версію під цю гру. Або вимкни перший мод у вкладці «Мої моди».
crash.depTooOld.title=Моду потрібна новіша версія іншого мода{0}
crash.depTooOld.advice=Залежність у збірці є, але стара (зліва мод, справа яка версія йому потрібна). Так буває у збірках з Modrinth, які використовують старі версії модів. Натисни «Грати» ще раз: перед запуском лаунчер сам поставить новішу версію з Modrinth, якщо вона там є. Якщо це не допомогло - відкрий «Збірка», вкладку «Мої моди», та онови цей мод самостійно.
crash.modCrash.title=Гру, схоже, вбив мод{0}
crash.modCrash.advice=У звіті про збій винним названо цей мод. Вимкни його та запусти гру ще раз. Якщо без нього все працює, пошукай новішу версію мода або напиши його автору.
crash.action.disableMod=Вимкнути «{0}»
crash.modDisabled=«{0}» вимкнено. Запусти гру ще раз. Увімкнути мод назад можна у вікні «Збірка», вкладка «Мої моди».
crash.modDisableFailed=Не вдалося вимкнути «{0}». Можливо, мод зайнятий: закрий гру та спробуй ще раз.
crash.corrupt.title=Файли гри пошкоджені
crash.corrupt.advice=Частина файлів пошкоджена або не довантажилась. Перевстанови пак - лаунчер завантажить їх заново.
crash.disk.title=Закінчилось місце на диску
crash.disk.advice=Звільни кілька гігабайт на диску з текою лаунчера та запусти гру знову.
crash.unknown.title=Причину визначити не вдалося
crash.unknown.advice=Спробуй запустити ще раз. Якщо гра знову закриється, напиши в підтримку: лог і звіт про збій лаунчер додасть сам, ми розберемось.
