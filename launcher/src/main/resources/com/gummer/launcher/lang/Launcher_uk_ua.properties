manage.gpu.howWin=Що це робить: перед запуском гри лаунчер ставить вибрану відеокарту для Java цієї збірки в налаштуваннях графіки Windows. Це те саме, що можна зробити вручну на сторінці «Параметри графіки», і там цей запис видно. Лаунчер робить це лише для своєї Java та не змінює вибір, який ти вже зробив у Windows сам. Повернеш «Як вирішить система» або видалиш збірку - і запис зникне.
manage.gpu.howLinux=Що це робить: для дискретної відеокарти гра запускається зі змінними PRIME (DRI_PRIME або PRIME offload від NVIDIA), щоб драйвер віддав її дискретній відеокарті. Інтегрована відеокарта на Linux і так стоїть за замовчуванням. У системі нічого не змінюється - змінні діють лише для цього запуску.
