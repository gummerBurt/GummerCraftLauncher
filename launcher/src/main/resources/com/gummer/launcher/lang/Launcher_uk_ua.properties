errors.supportText=У лаунчері виникла помилка (деталі нижче додано автоматично). Що я робив перед цим:
errors.unknownHint=Спробуй ще раз. Якщо помилка повторюється, натисни «Написати в підтримку»: деталі та лог підуть разом зі зверненням.
errors.unknownHintNoSupport=Спробуй ще раз. Якщо помилка повторюється, натисни «Скопіювати деталі» та надішли їх нам в Telegram: @gummerCraft_help_bot.
errors.startupTitle=Лаунчер не запустився
errors.startupFailed=Лаунчер не зміг запуститися через помилку.
errors.why.offline.title=Немає інтернет-з'єднання або сервер завантаження недоступний
errors.why.offline=Лаунчер не знайшов адресу сервера. Перевір інтернет-з'єднання, вимкни VPN чи проксі, якщо вони є, та спробуй ще раз.
errors.why.network.title=З'єднання обірвалось
errors.why.network=Сервер завантаження не відповів вчасно. Найчастіше в цьому винне нестабільне інтернет-з'єднання. Спробуй ще раз за хвилину - завантаження продовжиться з того місця, де зупинилось.
errors.why.ssl.title=Захищене з'єднання перехоплено
errors.why.ssl=Антивірус, проксі або фільтр мережі підміняє захищене з'єднання (HTTPS). Вимкни перевірку HTTPS в антивірусі або додай лаунчер у винятки, потім спробуй ще раз.
errors.why.disk.title=Закінчилось місце на диску
errors.why.disk=Звільни кілька гігабайт на диску з текою лаунчера та спробуй ще раз.
errors.why.diskNeed.title=Не вистачає місця на диску
errors.why.diskNeed=Для завантаження потрібно приблизно {0}, а на диску {2} вільно лише {1}. Звільни місце або перенеси теку лаунчера на інший диск: Налаштування, «Тека даних», «Вибрати іншу теку».
errors.why.virus.title=Антивірус заблокував файл
errors.why.virus=Антивірус (найчастіше Захисник Windows) вирішив, що файл небезпечний, і не дав його записати чи запустити. Для модів та Java це часто хибне спрацювання, але не завжди. Якщо файл з нашого модпака чи з Modrinth, віднови його з карантину антивірусу або додай теку лаунчера у винятки та спробуй ще раз. Якщо мод скачано з невідомого сайту, краще його видалити, та підшукати його або аналог в каталозі Modrinth.
errors.why.access.title=Немає доступу до файлу
errors.why.access=Windows або антивірус не дає лаунчеру записати файл. Закрий гру, якщо вона відкрита, додай теку лаунчера у винятки антивірусу та спробуй ще раз.
errors.why.locked.title=Файл зайнятий іншою програмою
errors.why.locked=Швидше за все винна запущена гра або антивірус, що саме перевіряє файл. Закрий гру, зачекай хвилину та спробуй ще раз.
errors.why.corrupt.title=Файл завантажився пошкодженим
errors.why.corrupt=Спробуй ще раз - пошкоджений файл завантажиться заново. Якщо проблема повторюється, причиною може бути антивірус або нестабільне інтернет-з'єднання.
