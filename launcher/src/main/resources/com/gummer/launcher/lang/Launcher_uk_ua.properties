features.homescreen=<html><br/><h1 style="text-align:center">Оберіть Додаткові Опції</h1><br/><p style="padding:0 20px 0 20px">В списку зліва перелічені доступні додаткові опції та доповнення клієнту<br/>Натисніть на будь-яку з них для того щоб переглянути детальний опис та інформацію щодо її функціоналу</p><p style="padding:0 20px 0 20px">Для того щоб доповнення було встановлено та увімкнене - необхідно щоб був відмічений чекбокс навпроти нього в списку доступних опцій. Щоб доповнення навпаки не було встановлено - чекбокс навпроти нього має бути не відміченним (пустим)</p><p style="padding:0 20px 0 20px">За замовченням будуть встановлені і увімкнені усі наявні додаткові опції. За бажжанням ви можете вимкнути деякі або всі додаткові опції та доповнення щоб отримати більш ванільний клієнт, проте наполегливо радимо встановити усі наявні доповнення, щоб мати змогу повноцінно насолодитись всіма фічами доступними на ГаммерКрафті!</p><p style="padding:0 20px 0 20px">Натиснить на кнопку продовжити після того як оберете доповнення та опції які бажаете встановити</p></html>
