manage.gpu.manual=Або вручну: запусти збірку один раз, натисни «Скопіювати шлях до Java», потім «Відкрити параметри графіки», там «Огляд» - і встав шлях у поле назви файлу, далі «Параметри» та обери «Висока продуктивність».
