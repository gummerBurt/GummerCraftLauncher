errors.technical=Технічно:
errors.showDetails=Показати деталі
errors.hideDetails=Сховати деталі
errors.copyDetails=Скопіювати деталі
errors.writeSupport=Написати в підтримку
errors.supportText=У лаунчері виникла помилка (деталі нижче додано автоматично). Що я робив перед цим:
errors.unknownHint=Спробуй ще раз. Якщо помилка повторюється, натисни «Написати в підтримку»: деталі та лог підуть разом зі зверненням.
errors.why.offline.title=Немає інтернету або сервер завантаження недоступний
errors.why.offline=Лаунчер не знайшов адресу сервера. Перевір підключення до інтернету, вимкни VPN чи проксі, якщо вони є, і спробуй ще раз.
errors.why.network.title=З'єднання обірвалось
errors.why.network=Сервер завантаження не відповів вчасно. Найчастіше це нестабільний інтернет. Спробуй ще раз за хвилину, завантаження продовжиться з того місця, де зупинилось.
errors.why.ssl.title=Захищене з'єднання перехоплено
errors.why.ssl=Антивірус, проксі або фільтр мережі підміняє захищене з'єднання (HTTPS). Вимкни перевірку HTTPS в антивірусі або додай лаунчер у винятки, потім спробуй ще раз.
errors.why.disk.title=Закінчилось місце на диску
errors.why.disk=Звільни кілька гігабайт на диску з папкою лаунчера і спробуй ще раз.
errors.why.access.title=Немає доступу до файлу
errors.why.access=Windows або антивірус не дає лаунчеру записати файл. Закрий гру, якщо вона відкрита, додай папку лаунчера у винятки антивірусу і спробуй ще раз.
errors.why.locked.title=Файл зайнятий іншою програмою
errors.why.locked=Найчастіше це запущена гра або антивірус, що саме перевіряє файл. Закрий гру, зачекай хвилину і спробуй ще раз.
errors.why.corrupt.title=Файл завантажився пошкодженим
errors.why.corrupt=Спробуй ще раз: пошкоджений файл завантажиться заново. Якщо повторюється, причиною може бути антивірус або нестабільний інтернет.
crash.windowTitle=Гра закрилась з помилкою
crash.headline={0}: гра закрилась з помилкою
crash.action.memory=Налаштувати пам'ять
crash.action.reinstall=Перевстановити пак
crash.action.drivers=Як оновити драйвер
crash.action.console=Відкрити консоль
crash.action.support=Написати в підтримку
crash.action.close=Закрити
crash.supportText=Гра {0} закрилась з помилкою. Лаунчер визначив: {1}. Лог і звіт про збій додано автоматично. Що я робив перед вильотом:
crash.memory.title=Грі не вистачило пам''яті
crash.memory.advice=Збільш пам''ять для цього паку: «Налаштувати пам''ять», далі 4-6 ГБ для модпаків. Більше половини оперативної пам''яті комп''ютера ставити не варто.
crash.memoryTooHigh.title=Java не змогла виділити стільки пам''яті
crash.memoryTooHigh.advice=У налаштуваннях стоїть більше пам''яті, ніж комп''ютер може дати. Зменш її: «Налаштувати пам''ять», наприклад до 4 ГБ, і закрий зайві програми.
crash.javaVersion.title=Не та версія Java
crash.javaVersion.advice=Пак запустився на Java, яка йому не підходить. Перевстанови пак: лаунчер заново поставить потрібну Java. Якщо в налаштуваннях лаунчера вибрано свою Java, вимкни це.
crash.driver.title=Проблема з драйвером відеокарти
crash.driver.advice=Гра впала в драйвері відеокарти. Онови драйвер з сайту виробника (NVIDIA, AMD або Intel), перезавантаж комп''ютер і спробуй ще раз. На ноутбуці з двома відеокартами вибери для Java потужнішу.
crash.duplicateMod.title=Один мод встановлено двічі{0}
crash.duplicateMod.advice=У папці модів є дві копії одного мода. Якщо ти додавав моди вручну, прибери зайву копію. Або перевстанови пак: лаунчер поверне його до чистого стану.
crash.modConflict.title=Моди не сумісні між собою{0}
crash.modConflict.advice=Один з модів не підходить до інших або до цієї версії гри. Якщо ти додавав моди вручну, прибери їх. Або перевстанови пак: лаунчер поверне його до чистого стану.
crash.mixin.title=Мод не зміг завантажитись{0}
crash.mixin.advice=Найчастіше це сторонній мод, доданий вручну, або пошкоджений файл. Перевстанови пак. Якщо не допоможе, напиши в підтримку: звіт про збій піде разом зі зверненням.
crash.corrupt.title=Файли гри пошкоджені
crash.corrupt.advice=Частина файлів пошкоджена або не докачалась. Перевстанови пак, лаунчер завантажить їх заново.
crash.disk.title=Закінчилось місце на диску
crash.disk.advice=Звільни кілька гігабайт на диску з папкою лаунчера і запусти гру знову.
crash.unknown.title=Причину визначити не вдалося
crash.unknown.advice=Спробуй запустити ще раз. Якщо гра знову закриється, напиши в підтримку: лог і звіт про збій лаунчер додасть сам, ми розберемось.
