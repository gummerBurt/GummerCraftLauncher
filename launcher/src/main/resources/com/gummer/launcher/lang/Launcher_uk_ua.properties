support.errorNick=Напиши свій нік на сервері: латиниця, цифри або _, від 3 до 16 символів.
support.errorAdminNick=Це нік адміністратора. Напиши свій справжній нік на сервері.
support.errorTopic=Обери тему звернення.
support.errorText=Опиши питання детальніше (хоча б кілька слів).
support.errorTooFast=Звернення щойно надіслано. Зачекай пару хвилин або допиши в чат звернення.
support.errorTooMany=Забагато звернень за годину. Допиши в чат останнього звернення, ми його бачимо.
support.chatTitle=Звернення #{0} · {1}
support.chatNote=Ми передали твоє повідомлення адміністрації. Зазвичай відповідаємо до кількох годин. Відповідь з'явиться тут, навіть якщо закриєш лаунчер.
