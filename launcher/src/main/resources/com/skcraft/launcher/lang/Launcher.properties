errors.writeSupport=Contact support
errors.supportText=The launcher showed an error (details below were added automatically). What I did before:
errors.unknownHint=Try again. If the error repeats, press "Contact support": the details and the log go with your request.
errors.unknownHintNoSupport=Try again. If the error repeats, press "Copy details" and send them to us on Telegram: @gummerCraft_help_bot.
errors.startupTitle=The launcher did not start
errors.startupFailed=The launcher could not start because of an error.
errors.why.offline.title=No internet or the download server is unreachable
errors.why.offline=The launcher could not resolve the server address. Check your internet connection, turn off VPN or proxy if you use one, and try again.
errors.why.network.title=The connection dropped
errors.why.network=The download server did not answer in time. Usually this is an unstable connection. Try again in a minute, the download continues where it stopped.
errors.why.ssl.title=The secure connection was intercepted
errors.why.ssl=An antivirus, proxy or network filter replaces the secure (HTTPS) connection. Turn off HTTPS scanning in the antivirus or add the launcher to its exclusions, then try again.
errors.why.disk.title=The disk is full
errors.why.disk=Free a few gigabytes on the disk with the launcher folder and try again.
errors.why.diskNeed.title=Not enough disk space
errors.why.diskNeed=The download needs about {0}, but drive {2} has only {1} free. Free up space or move the launcher folder to another drive: Settings, "Data folder", "Choose another folder".
errors.why.virus.title=An antivirus blocked a file
errors.why.virus=An antivirus (most often Windows Defender) decided the file is dangerous and did not let it be written or started. For mods and Java this is often a false alarm, but not always. If the file is from our modpack or from Modrinth, restore it from the antivirus quarantine or add the launcher folder to the exclusions and try again. If the mod was downloaded from an unknown site, better delete it.
errors.why.access.title=No access to a file
errors.why.access=Windows or an antivirus does not let the launcher write a file. Close the game if it is running, add the launcher folder to the antivirus exclusions and try again.
errors.why.locked.title=A file is used by another program
errors.why.locked=Usually the game is still running or an antivirus is scanning the file. Close the game, wait a minute and try again.
errors.why.corrupt.title=A file was downloaded damaged
errors.why.corrupt=Try again: the damaged file is downloaded anew. If it repeats, an antivirus or an unstable connection may be the cause.
crash.windowTitle=The game closed with an error
crash.headline={0}: the game closed with an error
crash.action.memory=Memory settings
crash.action.reinstall=Reinstall the pack
crash.action.drivers=How to update the driver
crash.action.console=Open console
crash.action.support=Contact support
crash.action.close=Close
crash.supportText=The game {0} closed with an error. The launcher found: {1}. The log and crash report were added automatically. What I did before the crash:
crash.memory.title=The game ran out of memory
crash.memory.advice=Give this pack more memory: "Memory settings", then 4-6 GB for modpacks. Do not set more than half of the computer''s RAM.
crash.memoryTooHigh.title=Java could not reserve that much memory
crash.memoryTooHigh.advice=The settings ask for more memory than the computer can give. Lower it in "Memory settings", for example to 4 GB, and close other programs.
crash.javaVersion.title=Wrong Java version
crash.javaVersion.advice=The pack started on a Java version it does not support. Reinstall the pack: the launcher installs the right Java again. If you chose your own Java in the launcher settings, turn that off.
crash.macArch.title=Wrong Java for an Apple Silicon Mac
crash.macArch.advice=The game ran on an Apple Silicon Java, but this Minecraft version only has Intel libraries. Update the launcher to the newest version and start again: it will use the Intel Java under Rosetta 2. If a custom Java is set in the settings, remove it.
crash.driver.title=A graphics driver problem
crash.driver.advice=The game crashed inside the graphics driver. Update the driver from the vendor''s site (NVIDIA, AMD or Intel), restart the computer and try again. On a laptop with two graphics cards choose the faster one for Java.
crash.duplicateMod.title=A mod is installed twice{0}
crash.duplicateMod.advice=The mods folder has two copies of one mod. If you added mods by hand, remove the extra copy. Or reinstall the pack to bring it back to a clean state.
crash.modConflict.title=Mods are not compatible{0}
crash.modConflict.advice=One of the mods does not fit the others or this game version. If you added mods by hand, remove them. Or reinstall the pack to bring it back to a clean state.
crash.mixin.title=A mod failed to load{0}
crash.mixin.advice=Usually this is a third-party mod added by hand or a damaged file. Reinstall the pack. If that does not help, contact support: the crash report goes with your request.
crash.missingDep.title=A mod is missing another mod{0}
crash.missingDep.advice=The first mod does not work without the second one, and it is not in this pack (left: the mod, right: what it needs). Open "Pack", the "Find mods" tab, and install it: the launcher picks the version for this game. Or turn off the first mod on the "My mods" tab.
crash.depTooOld.title=A mod needs a newer version of another mod{0}
crash.depTooOld.advice=The dependency is in the pack, but too old (left: the mod, right: the version it needs). Packs from Modrinth sometimes ship an old version. Press "Play" again: before launching, the launcher installs a newer version from Modrinth if there is one. If that does not help, open "Pack", the "My mods" tab, and update that mod.
crash.modCrash.title=A mod seems to have crashed the game{0}
crash.modCrash.advice=The crash report names this mod. Turn it off and start the game again. If everything works without it, look for a newer version of the mod or contact its author.
crash.action.disableMod=Turn off "{0}"
crash.modDisabled="{0}" is turned off. Start the game again. You can turn it back on in the "Pack" window, "My mods" tab.
crash.modDisableFailed=Could not turn off "{0}". The file may be in use: close the game and try again.
crash.corrupt.title=Game files are damaged
crash.corrupt.advice=Some files are damaged or incomplete. Reinstall the pack and the launcher downloads them again.
crash.disk.title=The disk is full
crash.disk.advice=Free a few gigabytes on the disk with the launcher folder and start the game again.
crash.unknown.title=The cause could not be found
crash.unknown.advice=Try starting again. If the game closes again, contact support: the launcher adds the log and the crash report itself, and we will look into it.
