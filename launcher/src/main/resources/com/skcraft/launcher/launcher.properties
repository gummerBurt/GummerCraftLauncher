version=${project.version}
pipelineId=${pipelineId}
branch=${branch}
commit=${commit}

launcherShortname=GummerCraft Launcher
offlinePlayerName=PlayerName

versionManifestUrl=https://launchermeta.mojang.com/mc/game/version_manifest.json
librariesSource=https://libraries.minecraft.net/
javaVersionManifestUrl=https://cdn.gummercraft.fun/v1/runtime/packages/7e/ed/7eede7b820cf8d42d035aeb3347a3b282df24976/manifest.json
assetsSource=https://resources.download.minecraft.net/
yggdrasilAuthUrl=https://authserver.mojang.com/authenticate
microsoftClientId=${microsoftClientId}
resetPasswordUrl=https://minecraft.net/resetpassword

newsUrl=https://cdn.gummercraft.fun/launcher/news/public.html?version=%s
packageListUrl=https://cdn.gummercraft.fun/v1/packages/manifest.json?key=%s
# 1.32+: modpack list v2 (same list + group, server, recommendedMemory); falls back to v1. Generator: tools/cdn/packages-v2.php
packageListUrlV2=https://cdn.gummercraft.fun/modpacks/packages-v2.php?key=%s
selfUpdateUrl=https://cdn.gummercraft.fun/launcher/install/release.json
# 1.33.1: anonymous "game started" event (which pack: our pack name, or kind and Minecraft version for Vanilla and mod loaders)
# plus the anonymous install ID. Nothing about the computer, nickname or account. "off" in stats-id.txt disables it.
# Empty = never sent. See com.gummer.launcher.stats.LaunchStats and SECURITY.md
launchStatsUrl=https://cdn.gummercraft.fun/launcher/stat
# 1.35: first install of a Minecraft version takes Mojang assets and libraries as archive(s) from our CDN
# (resume after a cut, every file checked by sha1, falls back to per-file downloads). Built by tools/cdn/base/build-base.py.
# Empty = always per-file. See com.gummer.launcher.install.BaseArchive
baseArchiveIndexUrl=https://cdn.gummercraft.fun/launcher/base/index.json
# 1.32: banner for players who still run the old exe (Java not bundled); empty = no banner. Off since 12.11 (owner: no banner)
newLauncherUrl=
# 1.32: in every error dialog, players on the old exe (Windows, Java not bundled) are offered to download the new launcher; empty = never
newLauncherDownloadUrl=https://gummercraft.fun/launcher
# 1.32: support requests from the launcher (Chatwoot Client API, inbox of type API "Лаунчер"). The inbox identifier is public
# (like a website widget token). Empty supportInboxId = no Support button.
supportUrl=https://support.gummercraft.fun
supportInboxId=ynvCUPDw4uSXDhHHj8xcbbQA
HasteUrl=https://logs.gummercraft.fun/
# 16.11.2026: likes for the launcher looks (one per IP per look), server script tools/cdn/design-like.php (CDN root, not under /launcher/). Empty = no like button.
# The "Design feedback" button next to it uses the support settings above.
designLikeUrl=https://cdn.gummercraft.fun/design-like.php
# 24.11.2026 (1.40.0): проксі CurseForge API для імпорту zip-збірок CurseForge (tools/cdn/cf.php, ключ лише на CDN).
curseforgeProxyUrl=https://cdn.gummercraft.fun/cf.php
# 26.11.2026: «Набори модів» у «Керуванні збіркою»: свіжий список (копія в jar: com/gummer/launcher/manage/mod-sets.json). Порожньо: лише копія з jar.
modSetsUrl=https://cdn.gummercraft.fun/launcher/mod-sets.json
# 21.11.2026: статус у Discord (DiscordPresence). Порожній discordClientId вимикає його зовсім.
# discordLargeImage: ключ картинки в Rich Presence Art Assets застосунку (порожньо: без картинки)
discordClientId=1573664818165055488
discordLargeImage=logo
# своя картинка в грі для збірки з такою назвою на диску (ключ у Art Assets)
discordLargeImage.staldayz=staldayz_icon
discordButtonLauncherUrl=https://gummercraft.fun/launcher?utm_source=discord-status
discordButtonDiscordUrl=https://go.gummer.cc/out/discord?src=discord-status

# 1.32: news and promo cards in the main window (changed without a launcher release). Empty = no cards.
# Hidden for now (12.11.2026: the card UI/UX will be designed separately). To enable:
# newsJsonUrl=https://cdn.gummercraft.fun/launcher/news/news.json
newsJsonUrl=
# 1.32: where "How to update the driver" in the crash window leads. Empty = no button.
driversHelpUrl=
# 1.32: small link to the launcher source code under the social buttons; empty = no link
sourceCodeUrl=https://github.com/gummerBurt/GummerCraftLauncher
# 1.32.2: жовта кнопка кави під Discord (з 1.32.5 напис «Підтримати») (порожньо = без кнопки)
coffeeUrl=https://buymeacoffee.com/gummer
# 1.33: optional server account ("My accounts" button): login, registration in AuthMe, skins (SkinsRestorer).
# API: /api/launcher/* on the skin site (node01, resources/server/launcherApi.php). serverAccount=false hides the button.
serverAccount=true
serverAccountUrl.staldayz=https://dayz.gummercraft.fun/api/launcher
serverAccountUrl.gummercraft=https://skin.gummercraft.fun/api/launcher
