# Оформлення вікна лаунчера для збірки staldayz (поруч bg_staldayz.jpg і logo_staldayz.png).
# Зсуви в пікселях вікна: x - плюс праворуч / мінус ліворуч, y - плюс нижче / мінус вище.
# Фон зсувається від центру, логотип - від стандартного місця. Фон не зсунеться так, щоб з'явилась порожнеча.
background.x=-40
background.y=30
logo.x=0
logo.y=15

# Куди веде кнопка "Вікі та FAQ", коли вибрано цю збірку (лише http/https; без рядка - загальна вікі лаунчера).
wiki.url=https://staldayz.gummercraft.fun/#start

# Кнопки соцмереж для цієї збірки (лише http/https; без рядка - загальні). На кнопці намальовано назву каналу,
# тому для свого каналу потрібна й своя картинка: ui/button/telegram_<мова>_staldayz.png (discord_... так само).
telegram.url=https://t.me/StalDayZ
# Якір жовтого сплешу (дизайн 1.35): ПОЧАТОК напису, частки видимої частини логотипа (0..1, можна більше 1 чи менше 0),
# x праворуч, y вниз; напис іде вгору-праворуч під кутом splash.angle (градуси, за замовчуванням 20).
# Якщо напис налазить на літери, лаунчер сам опускає його нижче (до 90 px).
splash.x=0.86
splash.y=0.92
splash.angle=20
# 16.11.2026: зсув напису з редактора власника (splash.manual: без автоматичного опускання)
splash.dx=-109
splash.dy=48
splash.manual=true
