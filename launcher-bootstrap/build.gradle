plugins {
    id 'application'
    id "com.github.johnrengelman.shadow"
    id 'io.freefair.lombok'
    id 'net.kyori.blossom'
    id 'edu.sc.seis.launch4j' version '2.5.4'
}

blossom {
  replaceToken("@version@", version)
}

application {
    mainClassName = "com.skcraft.launcher.Bootstrap"
}

jar {
    manifest {
        attributes("Main-Class": "com.gummer.launcher.Bootstrap")
        attributes("SplashScreen-Image": "com/gummer/launcher/splashscreen.png")
    }
    processResources.exclude('com/gummer/launcher/jaunc4j')
}

dependencies {
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation project(path: ':launcher-shared')
}

processResources {
    filesMatching('**/*.properties') {
        filter {
            it.replace('${project.version}', project.version)
        }
    }
}

shadowJar {
    archiveClassifier.set("")
}

build {
    dependsOn(shadowJar)
}



launch4j  {
    mainClassName = 'com.skcraft.launcher.Bootstrap'
    icon = "${projectDir}/src/main/resources/com/gummer/launcher/jaunc4j/app.ico"
    splashFileName = "${projectDir}/src/main/resources/com/gummer/launcher/jaunc4j/splashscreen.bmp"
    version =  project.version
    textVersion = project.version
    copyright = "GummerCraft (c) 2025"
    companyName = "GummerCraft.fun"
    productName = "GummerCraft Launcher"
    fileDescription = "GummerCraft Launcher"
    internalName = "GummerCraft Launcher"
    windowTitle = "GummerCraft Launcher"
    trademarks = "GummerCraft"
    supportUrl = "https://gummercraft.fun/support"
    // 1.36.15 (перший підписаний exe): заголовок і тексти вікон помилок Launch4j. Раніше будь-яка помилка старту мала
    // заголовок «Please install Java». Лише англійською: Launch4j показує вікно ANSI-функцією, і кирилиця на системах
    // з не кириличною кодовою сторінкою (наприклад, чеською) стала б кракозябрами. Після вікна Launch4j сам відкриває
    // supportUrl (а якщо Java не знайдено, downloadUrl).
    errTitle = "GummerCraft Launcher"
    messagesStartupError = "GummerCraft Launcher could not start Java. Please download GummerCraft.exe again from gummercraft.fun and run it. Your modpacks and accounts will stay. The support chat will open after you close this window."
    messagesBundledJreError = "The Java built into GummerCraft Launcher is damaged or missing (an antivirus often removes files from the jre folder). Please download GummerCraft.exe again from gummercraft.fun and run it. Your modpacks and accounts will stay. The support chat will open after you close this window."
    messagesJreVersionError = "GummerCraft Launcher needs Java 8 or newer. Easier way: download the new GummerCraft.exe from gummercraft.fun, it has Java built in."
    messagesLauncherError = "GummerCraft Launcher failed to start. Please download GummerCraft.exe again from gummercraft.fun and run it. Your modpacks and accounts will stay. The support chat will open after you close this window."
    // немає Java - відкривається пряме завантаження інсталятора Java 8 (x64) з сайту Oracle, без проміжного редиректу через наш домен.
    // Посилання Oracle з часом застарівають (BundleId): якщо почне вести на 404 - оновити тут і перезібрати exe.
    downloadUrl = "https://javadl.oracle.com/webapps/download/AutoDL?BundleId=253608_2fde65a2208f40a5b5f4c844b0dff092"
    // 1.32: вбудована Java. Тека jre поруч з exe (установка Inno Setup і портативний zip кладуть туди Temurin JRE 17 x64,
    // tools/installer/jre.lock: 17, бо Java 8 не масштабує вікно під масштаб Windows). Немає теки jre (exe скачали окремо,
    // як раніше) - Launch4j шукає встановлену Java 8+ як до 1.32.
    bundledJrePath = "jre"
    bundledJre64Bit = true
    bundledJreAsFallback = false
    jreMinVersion = "1.8.0"
    //jar = "../libs/${project.tasks.shadowJar.archiveFileName}" // now in afterEvaluate
    outfile = "Gummer_Craft_launcher.exe"
}

afterEvaluate {
  launch4j {
    jar = tasks.named("shadowJar").get().archiveFile.get().asFile.absolutePath
  }
}

tasks.named('createExe') {
  dependsOn tasks.named('shadowJar')
}
