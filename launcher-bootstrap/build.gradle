plugins {
    id 'application'
    id "com.github.johnrengelman.shadow"
    id 'io.freefair.lombok'
    id 'net.kyori.blossom'
    id 'edu.sc.seis.launch4j' version '2.5.4'
}

blossom {
  replaceToken("@version@", version)
}

application {
    mainClassName = "com.skcraft.launcher.Bootstrap"
}

jar {
    manifest {
        attributes("Main-Class": "com.gummer.launcher.Bootstrap")
        attributes("SplashScreen-Image": "com/gummer/launcher/splashscreen.png")
    }
    processResources.exclude('com/gummer/launcher/jaunc4j')
}

dependencies {
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation project(path: ':launcher-shared')
}

processResources {
    filesMatching('**/*.properties') {
        filter {
            it.replace('${project.version}', project.version)
        }
    }
}

shadowJar {
    archiveClassifier.set("")
}

build {
    dependsOn(shadowJar)
}



launch4j  {
    mainClassName = 'com.skcraft.launcher.Bootstrap'
    icon = "${projectDir}/src/main/resources/com/gummer/launcher/jaunc4j/app.ico"
    splashFileName = "${projectDir}/src/main/resources/com/gummer/launcher/jaunc4j/splashscreen.bmp"
    version =  project.version
    textVersion = project.version
    copyright = "GummerCraft (c) 2025"
    companyName = "GummerCraft.fun"
    productName = "GummerCraft Launcher"
    fileDescription = "GummerCraft Launcher"
    internalName = "GummerCraft Launcher"
    windowTitle = "GummerCraft Launcher"
    trademarks = "GummerCraft"
    supportUrl = "https://gummercraft.fun/support"
    errTitle = "Please install Java"
    // немає Java - відкривається пряме завантаження інсталятора Java 8 (x64) з сайту Oracle, без проміжного редиректу через наш домен.
    // Посилання Oracle з часом застарівають (BundleId): якщо почне вести на 404 - оновити тут і перезібрати exe.
    downloadUrl = "https://javadl.oracle.com/webapps/download/AutoDL?BundleId=253608_2fde65a2208f40a5b5f4c844b0dff092"
    //jar = "../libs/${project.tasks.shadowJar.archiveFileName}" // now in afterEvaluate
    outfile = "Gummer_Craft_launcher.exe"
}

afterEvaluate {
  launch4j {
    jar = tasks.named("shadowJar").get().archiveFile.get().asFile.absolutePath
  }
}

tasks.named('createExe') {
  dependsOn tasks.named('shadowJar')
}
